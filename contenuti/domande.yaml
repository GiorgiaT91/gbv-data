# Le sei domande, nell'ordine in cui compaiono in home.
# id: identificativo interno, usato nei nomi dei file; non cambia mai.
# stato: pronta | in-verifica | in-lavorazione. Una domanda è "pronta" quando supera il
#   criterio del Piano di progetto: numeri controllati, schede compilate,
#   pagina leggibile su telefono, testi riletti. "in-verifica": pagina costruita,
#   numeri da controllare sui siti originali (online con un avviso).
# modello: corta (domande 1, 2, 3, 6: pagina generata da src/pages/domande/[indirizzo].astro).
# indirizzo: solo per le domande pronte.
# fonti: identificativi delle fonti (vedi contenuti/fonti.yaml).

