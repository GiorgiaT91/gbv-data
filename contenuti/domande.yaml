# Le domande, nell'ordine in cui compaiono in home.
# id: identificativo interno, usato nei nomi dei file; non cambia mai.
# stato: pronta | in-verifica | in-lavorazione. Una domanda è "pronta" quando supera il
#   criterio del Piano di progetto: numeri controllati, schede compilate,
#   pagina leggibile su telefono, testi riletti. "in-verifica": pagina costruita,
#   numeri da controllare sui siti originali (online con un avviso).
# modello: corta (domande 1, 2, 3, 6: pagina generata da src/pages/domande/[indirizzo].astro).
# indirizzo: solo per le domande pronte.
# fonti: identificativi delle fonti (vedi contenuti/fonti.yaml).
# home: la tessera della domanda in home. etichetta; numero (fonte, filtro, unita: percentuale se è una quota)
#   oppure testo_numero (numero scritto a mano); descrizione; fonte_breve.
#   La prima domanda dell'elenco è la tessera grande, con cento punti.

- id: 1
  testo: "Quante donne subiscono violenza?"
  home:
    etichetta: "Il fenomeno"
    numero: { fonte: istat-sicurezza-donne, unita: percentuale, filtro: { anno: 2025, periodo: nella_vita, indicatore: violenza, categoria: fisica_o_sessuale } }
    descrizione: "delle donne italiane fra 16 e 75 anni ha subito violenza fisica o sessuale almeno una volta nella vita."
    fonte_breve: "Istat · 2025"
  stato: in-verifica
  modello: corta
  indirizzo: /domande/quante-donne-subiscono-violenza/
  fonti: [istat-sicurezza-donne]

- id: 6
  testo: "In che contesto nasce?"
  home:
    etichetta: "Il contesto"
    numero: { fonte: istat-stereotipi-adulti, unita: percentuale, filtro: { anno: 2023, indicatore: almeno_uno, categoria: TRGENROL } }
    descrizione: "delle persone fra 18 e 74 anni è d'accordo con almeno uno stereotipo sui ruoli di genere."
    fonte_breve: "Istat · 2023"
  stato: in-verifica
  modello: corta
  indirizzo: /domande/in-che-contesto-nasce/
  fonti: [istat-stereotipi-adulti, istat-stereotipi-ragazzi]

- id: 2
  testo: "Quante chiedono aiuto?"
  home:
    etichetta: "Le richieste di aiuto"
    numero: { fonte: istat-1522, filtro: { anno: 2025, periodo: anno, indicatore: chiamate_valide, categoria: totale } }
    descrizione: "chiamate valide al numero antiviolenza 1522 nel 2025."
    fonte_breve: "Istat-DPO · 2025"
  stato: in-verifica
  modello: corta
  indirizzo: /domande/quante-chiedono-aiuto/
  fonti: [istat-1522, istat-centri-antiviolenza, istat-case-rifugio, salute-pronto-soccorso]

- id: 3
  testo: "Cosa succede dopo una denuncia?"
  home:
    etichetta: "La giustizia"
    numero: { fonte: interno-reati-spia, filtro: { anno: 2023, periodo: anno, territorio: Italia, indicatore: delitti_denunciati, categoria: maltrattamenti } }
    descrizione: "delitti di maltrattamenti in famiglia denunciati alle forze di polizia."
    fonte_breve: "Ministero dell'Interno · 2023"
  stato: in-verifica
  modello: corta
  indirizzo: /domande/cosa-succede-dopo-una-denuncia/
  fonti: [interno-reati-spia, giustizia-processi-condanne]

- id: 4
  testo: "Quante donne vengono uccise?"
  home:
    etichetta: "I femminicidi"
    testo_numero: "circa 100"
    descrizione: "donne uccise ogni anno. Tre fonti, tre regole, numeri dello stesso ordine di grandezza."
    fonte_breve: "Istat · Ministero dell'Interno · Non Una Di Meno"
  stato: pronta
  indirizzo: /domande/quante-donne-vengono-uccise/
  fonti: [istat-omicidi, interno-femminicidi, nudm-osservatorio]
