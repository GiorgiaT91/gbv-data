numero_principale: "15"
titolo_messaggio: "Su 67 donne uccise nei primi nove mesi del 2026, 15 sono femminicidi per la legge"
componente: punti

chi_conta: "Il Servizio Analisi Criminale della Polizia criminale, Ministero dell'Interno"
da_dove_vengono_i_casi: "Dalla banca dati delle forze di polizia, confrontata con le informazioni dei presidi territoriali di Polizia e Carabinieri"
cosa_viene_contato: "Le vittime del reato di femminicidio (art. 577 bis del codice penale), in vigore dal 17 dicembre 2025. Sono contate a parte rispetto agli omicidi volontari (art. 575): una donna uccisa rientra nell'una o nell'altra voce."

limiti:
  - "Sono dati 'operativi': possono cambiare con le indagini e con le decisioni dei giudici."
  - "Tutti i 15 femminicidi registrati sono stati commessi da partner o ex partner: nessuno da altri familiari o da altre persone."
  - "Il report non dice dove sono avvenuti, né se c'erano state denunce o misure di protezione."
  - "Un caso è registrato come femminicidio quando è aperto un procedimento per l'art. 577 bis: la qualificazione dipende dall'accusa e può cambiare."
  - "È pubblicato solo in PDF."

nuove_domande:
  - "Come cambierà, nel corso dei procedimenti, la qualificazione dei 23 casi di donne uccise da partner o ex registrati come omicidio volontario?"
  - "Quante di queste donne avevano già denunciato?"

